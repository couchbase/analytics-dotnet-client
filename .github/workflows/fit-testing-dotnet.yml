name: Run FIT-CLI (Analytics)

on:
  schedule:
    # Each day at midnight (UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      fit_cli_preset:
        description: FIT preset to run (run `fit preset list` to view all)
        required: false
        type: string
        default: enterprise-analytics-func-lite
      fit_cli_channel:
        description: fit-cli install channel ("latest" or "ci").
        required: false
        type: string
        default: ci

permissions:
  id-token: write   # required for GitHub OIDC

jobs:
  run-analytics-dotnet-fit:
    uses: ./.github/workflows/fit-testing-shared.yml
    with:
      preset: ${{ vars.FIT_CLI_PRESET || inputs.fit_cli_preset || 'enterprise-analytics-func-lite' }}
      performer_image_name: 'analytics-dotnet-fit-performer:main'
      fit_cli_channel: ${{ vars.FIT_CLI_CHANNEL || inputs.fit_cli_channel || 'ci' }}
